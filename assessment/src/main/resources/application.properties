server.port=${ASSESSMENT_PORT:8091}
server.servlet.context-path=/assessment
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB
assessment.data-dir=${ASSESSMENT_DATA_DIR:./assessment-data}
assessment.simulation=${ASSESSMENT_SIMULATION:true}
assessment.bootstrap-user=${ASSESSMENT_ADMIN:admin}
assessment.bootstrap-password=${ASSESSMENT_ADMIN_PASSWORD:}
assessment.bootstrap-org=${ASSESSMENT_ADMIN_ORG:pilot}
assessment.rag-url=${ASSESSMENT_RAG_URL:}
assessment.rag-key=${ASSESSMENT_RAG_KEY:}
assessment.vision-url=${ASSESSMENT_VISION_URL:}
assessment.vision-key=${ASSESSMENT_VISION_KEY:}
assessment.model-url=${ASSESSMENT_MODEL_URL:}
assessment.model-key=${ASSESSMENT_MODEL_KEY:}
assessment.sso-url=${ASSESSMENT_SSO_URL:}
assessment.sso-key=${ASSESSMENT_SSO_KEY:}
assessment.chat-url=${ASSESSMENT_CHAT_URL:http://localhost:8089/index.html}
assessment.workers=2
assessment.queue-size=20
logging.level.root=INFO

# Approved dataset IDs for the configured institution; empty denies all live imports.
assessment.rag-datasets=${ASSESSMENT_RAG_DATASETS:}
